# Nightmare mode: realistic multi-worker prefork with keep-alive.
# The chain becomes timing-sensitive: the worker that aborts must be the
# worker you talk to next, and stage 3 wants a worker with a virgin heap.
KeepAlive On
KeepAliveTimeout 5

<IfModule mpm_prefork_module>
    StartServers           5
    MinSpareServers        3
    MaxSpareServers        10
    MaxRequestWorkers      25
    ServerLimit            25
    MaxConnectionsPerChild 0
</IfModule>
