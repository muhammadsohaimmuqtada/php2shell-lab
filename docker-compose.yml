# PHP2SHELL lab — six intentionally vulnerable PHP builds.
# All ports bind to 127.0.0.1. Profiles switch which builds are up.
name: php2shell-lab

x-web: &web
  platform: linux/amd64
  restart: unless-stopped
  volumes:
    - ./srv/webroot:/var/www/html:ro
    - ./srv/php.ini:/usr/local/etc/php/conf.d/zz-lab.ini:ro
    - ./srv/apache-single.conf:/etc/apache2/conf-enabled/zz-lab.conf:ro
    - ./docker/shared/entrypoint.sh:/usr/local/bin/lab-entrypoint.sh:ro
  entrypoint: ["/usr/local/bin/lab-entrypoint.sh"]
  command: ["apache2-foreground"]

services:
  web-8425:
    <<: *web
    build:
      context: ./docker
      dockerfile: 8.4.25/Dockerfile
    image: p2slab/web-8.4.25
    container_name: p2slab-8425
    profiles: ["8.4.25"]
    ports: ["127.0.0.1:8081:80"]

  web-8426:
    <<: *web
    build:
      context: ./docker
      dockerfile: 8.4.26/Dockerfile
    image: p2slab/web-8.4.26
    container_name: p2slab-8426
    profiles: ["8.4.26"]
    ports: ["127.0.0.1:8082:80"]

  web-8510:
    <<: *web
    build:
      context: ./docker
      dockerfile: 8.5.10/Dockerfile
    image: p2slab/web-8.5.10
    container_name: p2slab-8510
    profiles: ["8.5.10"]
    ports: ["127.0.0.1:8083:80"]

  web-8511:
    <<: *web
    build:
      context: ./docker
      dockerfile: 8.5.11/Dockerfile
    image: p2slab/web-8.5.11
    container_name: p2slab-8511
    profiles: ["8.5.11"]
    ports: ["127.0.0.1:8084:80"]

  web-8335:
    <<: *web
    build:
      context: ./docker
      dockerfile: 8.3.35/Dockerfile
    image: p2slab/web-8.3.35
    container_name: p2slab-8335
    profiles: ["8.3.35"]
    ports: ["127.0.0.1:8085:80"]

  web-8134:
    <<: *web
    build:
      context: ./docker
      dockerfile: 8.1.34/Dockerfile
    image: p2slab/web-8.1.34
    container_name: p2slab-8134
    profiles: ["8.1.34"]
    ports: ["127.0.0.1:8086:80"]
