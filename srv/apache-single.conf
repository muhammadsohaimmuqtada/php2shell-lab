# Deterministic single-worker prefork (default learning mode).
# Swap to apache-crowded.conf for nightmare mode (25 workers + keep-alive).
KeepAlive Off
<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
