# PHP2SHELL lab — six intentionally vulnerable PHP builds behind the gate.
#
#   8081-8086  budgeted entry (OOM-probe attempt budget per boot)
#   9081-9086  direct entry for crowded-worker/nightmare practice
#
# The gate is the only published service; targets are network-internal.
name: php2shell-lab

x-web: &web
  platform: linux/amd64
  restart: unless-stopped
  expose: ["80"]
  volumes:
    - ./srv/webroot:/var/www/html:ro
    - ./srv/php.ini:/usr/local/etc/php/conf.d/zz-lab.ini:ro
    - ./srv/apache-single.conf:/etc/apache2/conf-enabled/zz-lab.conf:ro
    - ./docker/shared/entrypoint.sh:/usr/local/bin/lab-entrypoint.sh:ro
    - ./srv/out:/out
  entrypoint: ["/usr/local/bin/lab-entrypoint.sh"]
  command: ["apache2-foreground"]

services:
  web-8425:
    <<: *web
    build:
      context: ./docker
      dockerfile: 8.4.25/Dockerfile
    image: p2slab/web-8.4.25
    container_name: p2slab-8425
    profiles: ["8.4.25"]

  web-8426:
    <<: *web
    build:
      context: ./docker
      dockerfile: 8.4.26/Dockerfile
    image: p2slab/web-8.4.26
    container_name: p2slab-8426
    profiles: ["8.4.26"]

  web-8510:
    <<: *web
    build:
      context: ./docker
      dockerfile: 8.5.10/Dockerfile
    image: p2slab/web-8.5.10
    container_name: p2slab-8510
    profiles: ["8.5.10"]

  web-8511:
    <<: *web
    build:
      context: ./docker
      dockerfile: 8.5.11/Dockerfile
    image: p2slab/web-8.5.11
    container_name: p2slab-8511
    profiles: ["8.5.11"]

  web-8335:
    <<: *web
    build:
      context: ./docker
      dockerfile: 8.3.35/Dockerfile
    image: p2slab/web-8.3.35
    container_name: p2slab-8335
    profiles: ["8.3.35"]

  web-8134:
    <<: *web
    build:
      context: ./docker
      dockerfile: 8.1.34/Dockerfile
    image: p2slab/web-8.1.34
    container_name: p2slab-8134
    profiles: ["8.1.34"]

  # No depends_on: targets start lazily via profiles; the gate forwards to
  # whatever is running and answers cleanly for what is not.
  gate:
    build: gate
    image: p2slab/gate
    container_name: p2slab-gate
    environment:
      P2S_BUDGET: "${P2S_BUDGET:-300}"
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:8084:8084"
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:8086:8086"
      - "127.0.0.1:9081:9081"
      - "127.0.0.1:9082:9082"
      - "127.0.0.1:9083:9083"
      - "127.0.0.1:9084:9084"
      - "127.0.0.1:9085:9085"
      - "127.0.0.1:9086:9086"
    restart: unless-stopped
